<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Taco Promo</title>
<!--
  Deterministic motion-graphics composition for the Taco promo video.
  Every visual is a pure function of time: render.mjs calls window.renderFrame(t)
  for each frame and screenshots the page. window.TIMELINE exposes the sound
  events that score.py turns into the soundtrack.
  Query: ?lang=zh|en, ?format=wide (1920×1080) or square (1080×1080, for small
  social-feed players: larger type and a closer, cursor-following camera).
-->
<style>
  :root {

    --mono: "DejaVu Sans Mono", "WenQuanYi Zen Hei Mono", monospace;
    --W: 1920px; --H: 1080px; --CX: 960px; --CY: 540px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--W); height: var(--H); overflow: hidden; background: var(--night); }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .layer { position: absolute; inset: 0; width: var(--W); height: var(--H); overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .center { transform-origin: 50% 50%; }

  /* Scene 1-2: chaos */
  #night { background: radial-gradient(1200px 800px at 50% 50%, #141a24 0%, var(--night) 70%); }
  #grid { opacity: .5; background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px); background-size: 64px 64px; }

  .card .hd { display: flex; align-items: center; gap: 12px; font-size: 24px; font-weight: 600; white-space: nowrap; }
  .card .em { font-size: 34px; font-family: "Noto Color Emoji"; }
  .card .ln { height: 10px; border-radius: 5px; background: #ffffff1c; margin-top: 14px; }
  .card .ln.s { width: 62%; }
  .card .ln.x { width: 82%; background: #ff6b6b44; }
  #chaosText { width: var(--W); text-align: center; top: 420px; color: #fff; }
  #chaosText .l1 { font-size: 64px; font-weight: 500; color: #9aa6b8; }
  #chaosText .l2 { font-size: 104px; font-weight: 800; letter-spacing: -1px; margin-top: 10px; }
  #count { display: inline-block; min-width: 1.2em; color: var(--orange); font-variant-numeric: tabular-nums; }
  #flash { background: #fff; }
  #fileIcon { width: 200px; height: 250px; margin: -125px 0 0 -100px; left: var(--CX); top: 470px; }
  #fileLabel { width: var(--W); text-align: center; top: 640px; font: 600 44px var(--mono); color: #fff; }
  #ifText { width: var(--W); text-align: center; top: 190px; font-size: 76px; font-weight: 700; color: #fff; }
  #ifText em { font-style: normal; color: var(--green); }

  /* Scene 3: reveal */
  .wipe { border-radius: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; left: var(--CX); top: var(--CY); }
  #paper { background: var(--paper); }
  #logo { left: var(--CX); top: 470px; width: 0; height: 0; }
  .bub { position: absolute; border-radius: 50%; }
  #wordmark { font-size: 230px; font-weight: 800; letter-spacing: -8px; line-height: 1; position: absolute; left: 30px; top: -130px; white-space: nowrap; }
  #tagline { width: var(--W); text-align: center; top: 700px; font-size: 54px; font-weight: 500; color: #3a404a; line-height: 1.45; }
  #tagline b { color: var(--ink); font-weight: 800; background: linear-gradient(transparent 62%, #3ecf8e66 62%); }

  /* Scene 4-5: product window */
  #win { left: 168px; top: 64px; width: 1584px; height: 935px; border-radius: 18px; overflow: hidden; background: #fff;
         box-shadow: 0 50px 120px #0f111533, 0 0 0 1px #0f111514; transform-origin: 50% 50%; }
  #bar { height: 44px; background: #ececea; display: flex; align-items: center; padding: 0 18px; gap: 9px; border-bottom: 1px solid #ddd; }

  #url { margin-left: 18px; flex: 1; height: 28px; border-radius: 8px; background: #fff; font: 15px var(--mono); color: #555; display: flex; align-items: center; padding: 0 14px; gap: 8px; }
  #url b { color: var(--ink); font-weight: 600; }

  #viewport { position: absolute; left: 0; top: 44px; width: 1584px; height: 891px; overflow: hidden; background: #fff; }
  #cam { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; transform-origin: 0 0; }
  #cam img { position: absolute; left: 0; top: 0; width: 1440px; height: 810px; }
  #cursor { position: absolute; left: 0; top: 0; width: 26px; height: 34px; }
  #ripple { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 4px solid var(--green); }
  .chip { left: 120px; top: 860px; display: flex; align-items: center; gap: 22px; background: #0f1115ee; color: #fff; padding: 22px 34px 22px 22px;
          border-radius: 24px; box-shadow: 0 24px 60px #0005; }
  .chip .n { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 800; color: #0f1115; }
  .chip .t { font-size: 40px; font-weight: 700; }
  .chip .s { font-size: 24px; color: #aab3c2; margin-top: 4px; }

  /* Scene 6: agent */
  #term { left: 1010px; top: 230px; width: 820px; height: 620px; border-radius: 18px; background: #0d1117; box-shadow: 0 50px 120px #0f111555; overflow: hidden; }
  #term .tb { height: 44px; background: #161b22; display: flex; align-items: center; padding: 0 18px; gap: 9px; }
  #term .tb i { width: 13px; height: 13px; border-radius: 50%; display: block; }
  #term .tb span { margin-left: 16px; color: #8b949e; font: 16px var(--mono); }
  #termBody { padding: 28px 32px; font: 25px/1.75 var(--mono); color: #c9d1d9; white-space: pre; }
  #termBody .p { color: var(--green); }
  #termBody .d { color: #8b949e; }
  #termBody .q { color: #e3b341; }
  #termBody .ok { color: var(--green); }
  #termBody .em { font-family: "Noto Color Emoji"; }
  .caret { display: inline-block; width: 13px; height: 28px; background: #c9d1d9; vertical-align: -5px; }
  #loop { left: var(--CX); top: var(--CY); width: 0; height: 0; }
  .node { position: absolute; width: 300px; margin-left: -150px; text-align: center; }
  .node .dot { width: 130px; height: 130px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; font: 60px "Noto Color Emoji"; background: #fff; box-shadow: 0 16px 40px #0f111522; border: 5px solid #e3e5e8; }
  .node .lb { font-size: 32px; font-weight: 700; margin-top: 14px; }
  #loopCenter { position: absolute; width: 600px; left: -300px; top: -78px; text-align: center; font-size: 52px; font-weight: 800; line-height: 1.5; }
  #loopCenter span { color: #8a919c; font-weight: 600; }
  #traveler { position: absolute; width: 64px; height: 80px; margin: -40px 0 0 -32px; }

  /* Scene 7: claims */
  #claim { display: grid; place-items: center; text-align: center; color: #fff; }
  #claimWord { display: inline-block; white-space: nowrap; font-size: 190px; font-weight: 900; letter-spacing: -4px; line-height: 1.1; }
  #claimSub { font-size: 48px; font-weight: 500; opacity: .85; margin-top: 26px; }

  /* Scene 8: CTA */
  #cta { background: #fff; }
  #ctaLogo { left: var(--CX); top: 250px; width: 0; height: 0; }
  #ctaHead { width: var(--W); text-align: center; top: 390px; font-size: 92px; font-weight: 800; letter-spacing: -1px; }
  #ctaHead em { font-style: normal; color: var(--green); }
  #cmd { left: var(--CX); top: 590px; transform-origin: 50% 50%; background: #0f1115; color: #e6edf3; border-radius: 22px; padding: 30px 46px;
         font: 38px var(--mono); white-space: pre; box-shadow: 0 30px 80px #0f111544; }
  #cmd .p { color: var(--green); }
  #ctaUrl { width: var(--W); text-align: center; top: 760px; font-size: 36px; color: #5b6270; }
  #ctaUrl b { color: var(--ink); }
  #ps { width: max-content; left: var(--CX); top: 860px; display: flex; align-items: center; gap: 30px; background: #fffbe8; border: 2px solid #f3d27a; border-radius: 26px; padding: 18px 34px 18px 18px; box-shadow: 0 24px 60px #0f111522; }
  #ps .thumb { width: 300px; height: 170px; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid #0002; background: #fff; }
  #ps img { position: absolute; width: 1100px; height: 619px; left: -830px; top: -215px; }
  #ps .t { font-size: 34px; font-weight: 700; line-height: 1.45; }
  #ps .t span { color: #8a6d1d; font-weight: 600; font-size: 26px; display: block; }
  #fade { background: #000; }
  /* Square social cut: everything larger, the product window fills the frame */
  .sq { --W: 1080px; --H: 1080px; --CX: 540px; --CY: 540px; }
  .sq #chaosText { top: 330px; padding: 0 50px; }
  .sq #chaosText .l1 { font-size: 72px; }
  .sq #chaosText .l2 { font-size: 100px; line-height: 1.15; }
  .sq #ifText { top: 150px; padding: 0 60px; font-size: 80px; line-height: 1.25; }
  .sq #fileIcon { top: 560px; }
  .sq #fileLabel { top: 730px; font-size: 52px; }
  .sq #logo { top: 420px; }
  .sq #wordmark { font-size: 200px; }
  .sq #tagline { top: 640px; padding: 0 40px; font-size: 50px; }
  .sq #win { left: 20px; top: 210px; width: 1040px; height: 850px; }
  .sq #bar { height: 52px; }
  .sq #url { font-size: 20px; height: 34px; }
  .sq #url .off { font-size: 18px; }
  .sq #viewport { top: 52px; width: 1040px; height: 798px; }
  .sq #cursor { width: 34px; height: 44px; }
  .sq .chip { left: 30px; top: 22px; width: 1020px; padding: 22px 30px; gap: 26px; }
  .sq .chip .n { width: 84px; height: 84px; font-size: 46px; flex: none; }
  .sq .chip .t { font-size: 58px; }
  .sq .chip .s { font-size: 32px; }
  .sq #term { left: 30px; top: 170px; width: 1020px; height: 760px; }
  .sq #term .tb span { font-size: 22px; }
  .sq #termBody { font-size: 31px; padding: 30px 30px; white-space: pre-wrap; }
  .sq .node { width: 340px; margin-left: -170px; }
  .sq .node .dot { width: 150px; height: 150px; font-size: 72px; }
  .sq .node .lb { font-size: 38px; }
  .sq #loopCenter { width: 440px; left: -220px; top: -70px; font-size: 52px; }
  .sq #claimWord { white-space: normal; max-width: 980px; font-size: 170px; }
  .sq #claimSub { font-size: 50px; padding: 0 40px; }
  .sq #ctaLogo { top: 220px; }
  .sq #ctaHead { top: 330px; padding: 0 50px; font-size: 92px; line-height: 1.2; }
  .sq #cmd { top: 640px; font-size: 30px; padding: 28px 34px; }
  .sq #ctaUrl { top: 740px; font-size: 38px; }
  .sq #ps { top: 870px; }
  .sq #ps .t { font-size: 38px; }
  .sqbr { display: none; }
  .sq .sqbr { display: inline; }
</style>
</head>

  const p = spring(seg(t, S.cta + BAR * 2.5, S.cta + BAR * 2.5 + 1.2));
  set($('ps'), p > 0 ? 1 : 0, `translate(-50%, ${(1 - p) * 300 - 60}px)`);
  $('ctaHead').style.top = `${(SQ ? 330 : 390) - shift * 70}px`;
  host.style.top = `${(SQ ? 220 : 250) - shift * 70}px`;
  set($('fade'), seg(t, S.end - 0.7, S.end));
}

// ---------- entry points ----------
window.TIMELINE = { duration: DURATION, bpm: BPM, scenes: S, events: EVENTS, size: { width: W, height: H } };
window.setup = (shots, dir, psShot) => {
  SHOTS = shots; SHOT_DIR = dir;
  buildProductTimeline();
  EVENTS.sort((a, b) => a.t - b.t);
  $('psImg').src = dir + '/' + psShot;
  const files = new Set(track.map(k => k.file));
  return Promise.all([...files, psShot].map(f => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = dir + '/' + f; })));
};
window.renderFrame = t => {
  chaos(t); reveal(t); product(t); agent(t); claims(t); cta(t);
  return new Promise(r => { const img = $('shot'); (img.complete ? Promise.resolve() : img.decode().catch(() => {})).then(() => requestAnimationFrame(() => r())); });
};
